[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "heliotherm2mqtt"
version = "0.1.0"
description = "Bridge Heliotherm heat pumps (Modbus TCP) to MQTT, with Home Assistant discovery"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Tim Alston" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "aiomqtt>=2.3,<3",
    "pydantic>=2.7,<3",
    "pymodbus>=3.10,<4",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "jinja2>=3",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-PyYAML",
]

[project.scripts]
heliotherm2mqtt = "heliotherm2mqtt.__main__:main"

[project.urls]
Homepage = "https://github.com/deggle/heliotherm2mqtt"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]
mypy_path = "tools"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymodbus.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
